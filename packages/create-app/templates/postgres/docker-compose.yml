services:
{{#IF_POSTGRES}}
  postgres:
    image: postgres:16-alpine
    container_name: {{SERVICE_NAME_KEBAB}}-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: template_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d template_db"]
      interval: 10s
      timeout: 5s
      retries: 5
{{/IF_POSTGRES}}

{{#IF_MONGO}}
  mongodb:
    image: mongo:latest
    container_name: {{SERVICE_NAME_KEBAB}}-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: template_db
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
{{/IF_MONGO}}

{{#IF_REDIS}}
  redis:
    image: redis:latest
    container_name: {{SERVICE_NAME_KEBAB}}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
{{/IF_REDIS}}

{{#IF_KAFKA}}
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: {{SERVICE_NAME_KEBAB}}-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    container_name: {{SERVICE_NAME_KEBAB}}-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper
{{/IF_KAFKA}}

{{#IF_OTEL}}
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: {{SERVICE_NAME_KEBAB}}-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: {{SERVICE_NAME_KEBAB}}-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
{{/IF_OTEL}}

volumes:
{{#IF_POSTGRES}}
  postgres_data:
{{/IF_POSTGRES}}
{{#IF_MONGO}}
  mongodb_data:
{{/IF_MONGO}}
{{#IF_REDIS}}
  redis_data:
{{/IF_REDIS}}
